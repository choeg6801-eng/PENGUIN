<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>펭귄상사 얼음 사막 대작전</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{--ink:#1f2d3d;--shadow:#1f2d3d;--c1:#3d9be0;--c2:#2fb383;--c3:#8a73ee;--acc:#ffd1dc;--box:#fffdf6;--wide:#ffb347;--chap:radial-gradient(circle,#2b2250,#0d0b1f);
 --bgpat:#cfeaff radial-gradient(circle at 25% 25%,rgba(255,255,255,.8) 0 3px,transparent 4px) 0 0/48px 48px}
:root{--font:'Jua'}
.app .box{background:linear-gradient(#ffffffee,#eaf6ffee);border-color:#1f5f99;box-shadow:0 5px 0 #1f5f99,inset 0 0 0 3px #d7efff}
.app .status{background:linear-gradient(#ffffff,#e4f4ff);border-color:#1f5f99}
.app .speaker{background:#3d9be0;color:#fff}
.app .ch{border-radius:22px 22px 22px 6px}

*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Jua',sans-serif;color:var(--ink);min-height:100vh;padding:12px 12px 30px;background:var(--bgpat)}
.app{max-width:680px;margin:0 auto}
.app.shake{animation:shk .45s}
@keyframes shk{15%{transform:translate(-8px,4px) rotate(-1deg)}30%{transform:translate(7px,-5px) rotate(1deg)}45%{transform:translate(-6px,3px)}60%{transform:translate(5px,-2px)}75%{transform:translate(-3px,1px)}}
.status{display:flex;gap:8px;align-items:center;background:#fff;border:3px solid var(--ink);border-radius:18px;padding:8px 12px;box-shadow:0 4px 0 var(--shadow);margin-bottom:10px}
.hpwrap{flex:1;min-width:0;font-size:14px}
.bar{height:14px;margin-top:3px;background:#eee;border:2px solid var(--ink);border-radius:10px;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff5f7e,#ffb36b);transition:width .6s cubic-bezier(.3,1.6,.5,1)}
.hpwrap.low .bar i{background:#ff2e4d;animation:blink .5s infinite}
.chip{background:var(--acc);border:2px solid var(--ink);border-radius:12px;padding:4px 8px;white-space:nowrap;font-size:14px}
.chip.pop{animation:cpop .45s}
@keyframes cpop{50%{transform:scale(1.4) rotate(-8deg)}}
.snd{background:#fff;border:2px solid var(--ink);border-radius:10px;font-size:16px;padding:2px 6px;cursor:pointer}

/* ---------- 무대 ---------- */
.stage{position:relative;height:clamp(280px,52vh,400px);border:3px solid var(--ink);border-radius:22px;overflow:hidden;box-shadow:0 5px 0 var(--shadow);background:#000}
.stage>*{position:absolute}
#sky,#props,#actors,#parts{inset:0}
#props,#actors,#parts{pointer-events:none}
#sky{transition:background .3s}
#sea{left:0;right:0;bottom:0;height:46%;background:var(--w)}
#sea::before,#sea::after{content:'';position:absolute;left:0;right:0;height:26px;top:-13px;background:radial-gradient(circle at 20px 26px,var(--w) 17px,transparent 18px) 0 0/40px 26px repeat-x;animation:wave 1.8s linear infinite}
#sea::after{top:10px;filter:brightness(1.3);opacity:.5;animation-duration:2.6s;animation-direction:reverse}
.storm #sea::before{animation-duration:.6s;transform:scaleY(1.8)}
.storm #sea::after{animation-duration:.9s}
@keyframes wave{to{background-position-x:40px}}
#ground{left:0;right:0;bottom:0;height:18%;border-top:0 solid rgba(0,0,0,.28)}

/* 소품 */
.prop{position:absolute;transform:translateX(-50%);line-height:0}
.prop svg,.actor svg{width:100%;height:auto;display:block;overflow:visible}
.a-bob{animation:bob 2.4s ease-in-out infinite}
.a-pulse{animation:pulse 2s ease-in-out infinite}
.a-spin{animation:spin 16s linear infinite}
.a-sway{animation:sway 2.4s ease-in-out infinite;transform-origin:50% 100%}
.a-rock{animation:rock 2s ease-in-out infinite;transform-origin:50% 100%}
.a-cloud{animation:cross 26s linear infinite}
.a-fly{animation:cross 8s linear infinite,bob .7s ease-in-out infinite}
.a-ship{animation:cross 22s linear infinite,rock 2.4s ease-in-out infinite}
.a-zoom{animation:cross 3.4s linear infinite}
@keyframes bob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-8px)}}
@keyframes pulse{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.08)}}
@keyframes spin{from{transform:translateX(-50%) rotate(0)}to{transform:translateX(-50%) rotate(360deg)}}
@keyframes sway{0%,100%{transform:translateX(-50%) rotate(-3deg)}50%{transform:translateX(-50%) rotate(3deg)}}
@keyframes rock{0%,100%{transform:translateX(-50%) rotate(-4deg)}50%{transform:translate(-50%,4px) rotate(4deg)}}
@keyframes cross{from{left:-25%}to{left:125%}}
@keyframes blink{50%{opacity:.25}}
@keyframes spinr{to{transform:rotate(360deg)}}
.po{stroke:#2b1d1a;stroke-width:3;stroke-linejoin:round}
.po2{stroke:rgba(43,29,26,.28);stroke-width:2}
.pln{stroke:#2b1d1a;stroke-width:3;fill:none;stroke-linecap:round}
svg .rays{transform-origin:50px 50px;transform-box:view-box;animation:spinr 16s linear infinite}
svg .wheel{transform-box:fill-box;transform-origin:center;animation:spinr .45s linear infinite}
svg .puff{transform-box:fill-box;transform-origin:center;animation:puff 2.6s ease-out infinite}
svg .p2{animation-delay:-.9s}svg .p3{animation-delay:-1.7s}
@keyframes puff{0%{transform:translateY(8px) scale(.4);opacity:0}30%{opacity:.9}100%{transform:translateY(-24px) scale(1.5);opacity:0}}
svg .scan{animation:scan 1.6s linear infinite}
@keyframes scan{from{transform:translateY(0)}to{transform:translateY(48px)}}
svg .hang{transform-origin:70px 60px;transform-box:view-box;animation:hang 3s ease-in-out infinite}
@keyframes hang{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
svg .glow{animation:glow 2.4s ease-in-out infinite}
@keyframes glow{50%{opacity:.45}}
svg .hand{transform-origin:45px 45px;transform-box:view-box;animation:spinr 4s linear infinite}
svg .siren,svg .bolt{animation:blink .6s infinite}
svg .rainw{animation:rainw .5s linear infinite}
@keyframes rainw{to{transform:translateY(14px)}}
svg .hf{transform-box:fill-box;animation:hf 2.2s ease-out infinite}
@keyframes hf{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-70px);opacity:0}}

/* 파티클 */
.pt{position:absolute;pointer-events:none;font-style:normal;font-size:16px}
.k-fall{animation:fall linear infinite}
@keyframes fall{from{top:-10%;transform:rotate(0)}to{top:105%;transform:rotate(360deg)}}
.p-rain{width:2px;height:16px;background:rgba(210,230,255,.75);border-radius:2px;animation-name:rain;transform:rotate(12deg)}
@keyframes rain{from{top:-10%}to{top:105%}}
.p-snow{color:#fff;text-shadow:0 0 2px rgba(0,0,0,.2)}
.p-confetti{width:8px;height:12px;border-radius:2px}
.k-tw{animation:tw ease-in-out infinite;color:#fff}
@keyframes tw{50%{opacity:.1;transform:scale(.5)}}
.k-wind{animation:wind linear infinite;width:3px;height:3px;border-radius:50%;background:#fff3c4}
@keyframes wind{from{left:-5%}to{left:105%}}

/* ---------- 캐릭터 ---------- */
#world{inset:0;transform-origin:50% 80%}
.actor{position:absolute;bottom:5%;transform:translateX(-50%);z-index:2}
.actor.pa{z-index:1}
.mv,.rx,.fl{line-height:0}
.rx{transform-origin:50% 100%}
.fl.flip{transform:scaleX(-1)}
.pa .fl{animation:pbob 2.6s ease-in-out infinite}
@keyframes pbob{50%{transform:translateY(-5px)}}
.spawn{position:absolute;bottom:5%;transform:translateX(-50%);z-index:3;line-height:0}
.spawn svg{width:100%;height:auto;display:block;overflow:visible}
.chr .o{stroke:#3b2621;stroke-width:2.3;stroke-linejoin:round}
.chr .ln{stroke:#2b1d1a;stroke-width:2.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
.chr .bod,.chr .head,.chr .blink,.chr .tail,.chr .arm,.chr .leg,.chr .jaw,.chr .m-o,.chr .fx-sweat,.chr .fx-z,.chr .fx-ang,.chr .fx-q,.chr .fx-tear,.chr .fan{transform-box:fill-box}
/* 기본 대기 동작: 은은하게 */
.chr .bod{transform-origin:50% 100%;animation:breathe 3.4s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.012,.988) translateY(1px)}}
.chr .head{transform-origin:50% 92%;animation:headidle 5s ease-in-out infinite}
@keyframes headidle{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(1.6deg)}}
.chr .blink{transform-origin:50% 50%;animation:blk 4.6s infinite}
@keyframes blk{0%,94%,100%{transform:scaleY(1)}96.5%{transform:scaleY(.08)}}
.chr .tail{transform-origin:0% 100%;animation:wag 1.9s ease-in-out infinite}
@keyframes wag{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(7deg)}}
.chr .fan{transform-origin:50% 100%;animation:fan 3s ease-in-out infinite}
@keyframes fan{50%{transform:scale(1.04)}}
.chr .arm{transform-origin:50% 6%;animation:armsw 3.4s ease-in-out infinite;transition:transform .3s cubic-bezier(.3,1.4,.5,1)}
@keyframes armsw{0%,100%{transform:rotate(0)}50%{transform:rotate(-3deg)}}
.chr .leg{transform-origin:50% 0%}
/* 걷기 */
.walk .leg.l{animation:stepA .34s ease-in-out infinite alternate}
.walk .leg.r{animation:stepB .34s ease-in-out infinite alternate}
.walk .arm.al{animation:armA .34s ease-in-out infinite alternate}
.walk .arm.ar{animation:armB .34s ease-in-out infinite alternate}
.walk .bod{animation:walkbob .17s ease-in-out infinite alternate}
.walk .head{animation:none;transform:rotate(-2deg)}
.run .leg.l,.run .leg.r,.run .arm,.run .bod{animation-duration:.18s!important}
@keyframes stepA{from{transform:rotate(20deg)}to{transform:rotate(-20deg)}}
@keyframes stepB{from{transform:rotate(-20deg)}to{transform:rotate(20deg)}}
@keyframes armA{from{transform:rotate(-22deg)}to{transform:rotate(18deg)}}
@keyframes armB{from{transform:rotate(18deg)}to{transform:rotate(-22deg)}}
@keyframes walkbob{from{transform:translateY(0) scale(1,1)}to{transform:translateY(-4px) scale(.99,1.01)}}
/* 표정 */
.chr .eyes>g,.chr .mouth>g,.chr .brows>path,.chr .fx>*{display:none}
.f-normal .chr .e-n,.f-angry .chr .e-n,.f-sad .chr .e-n,.f-cry .chr .e-c,.f-eat .chr .e-h{display:inline}
.f-happy .chr .e-h{display:inline}
.f-shock .chr .e-s{display:inline}
.f-sleep .chr .e-c{display:inline}
.f-ko .chr .e-x{display:inline}
.f-normal .chr .m-n,.f-sleep .chr .m-n{display:inline}
.f-happy .chr .m-h{display:inline}
.f-shock .chr .m-o,.f-ko .chr .m-o{display:inline}
.f-angry .chr .m-g{display:inline}
.f-sad .chr .m-s,.f-cry .chr .m-s{display:inline}
.f-angry .chr .b-ang{display:inline}
.f-sad .chr .b-sad,.f-shock .chr .b-sad,.f-cry .chr .b-sad{display:inline}
.f-eat .chr .m-o{display:inline;transform-origin:50% 20%;animation:talkm .2s ease-in-out infinite alternate}
.talk .chr .mouth>g{display:none!important}
.talk .chr .mouth .m-o{display:inline!important;transform-origin:50% 20%;animation:talkm .15s ease-in-out infinite alternate}
@keyframes talkm{from{transform:scaleY(.2)}to{transform:scaleY(1)}}
.talk .chr .jaw,.f-eat .chr .jaw{animation:jaw .15s infinite alternate}
@keyframes jaw{to{transform:translateY(4px)}}
.m-tremble .chr .fx-sweat,.m-sway .chr .fx-sweat,.f-shock .chr .fx-sweat{display:inline!important;animation:drip 1.2s ease-in infinite}
@keyframes drip{0%{transform:translateY(-3px);opacity:0}30%{opacity:1}100%{transform:translateY(10px);opacity:0}}
.m-sleep .chr .fx-z{display:inline!important;animation:zz 2.6s ease-in-out infinite}
@keyframes zz{0%{transform:translate(0,4px);opacity:0}40%{opacity:1}100%{transform:translate(6px,-12px);opacity:0}}
.m-angry .chr .fx-ang{display:inline!important;animation:angp .6s ease-in-out infinite alternate}
@keyframes angp{to{transform:scale(1.2)}}
.f-ko .chr .fx-ko{display:inline!important}
.chr .fx-ko{transform-origin:60px 26px;transform-box:view-box;animation:spinr 1.3s linear infinite}
.f-cry .chr .fx-tear{display:inline!important;animation:tear .5s ease-in-out infinite alternate}
@keyframes tear{from{opacity:.6;transform:scaleY(.8)}to{opacity:1;transform:scaleY(1.1)}}
.p-think .chr .fx-q{display:inline!important;animation:qbob .8s ease-in-out infinite alternate}
@keyframes qbob{to{transform:translateY(-4px) rotate(10deg)}}
/* 감정별 대기 동작 (차분하게) */
.m-happy .bod{animation:happyb 1.3s ease-in-out infinite}
@keyframes happyb{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.m-happy .arm{animation:none;transform:rotate(28deg)}
.m-tremble .bod{animation:shiv .14s linear infinite}
@keyframes shiv{25%{transform:translateX(-1px)}75%{transform:translateX(1px)}}
.m-tremble .arm{animation:none;transform:rotate(-22deg)}
.m-angry .bod{animation:huff 1.8s ease-in-out infinite}
@keyframes huff{0%,68%,100%{transform:scale(1,1)}78%{transform:scale(1.05,.95)}88%{transform:scale(.98,1.02)}}
.m-angry .arm{animation:fist .2s ease-in-out infinite alternate}
@keyframes fist{from{transform:rotate(78deg)}to{transform:rotate(92deg)}}
.m-sway .bod{animation:swayb 1.6s ease-in-out infinite}
@keyframes swayb{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
.m-sway .arm{animation:flail .35s ease-in-out infinite alternate}
@keyframes flail{from{transform:rotate(110deg)}to{transform:rotate(150deg)}}
.m-sleep .bod{animation:breathe 4.5s ease-in-out infinite}
.m-sleep .head{animation:none;transform:rotate(12deg)}
.m-sleep .arm,.m-sad .arm{animation:none;transform:rotate(-4deg)}
.m-sad .head{animation:none;transform:rotate(-7deg) translateY(3px)}
.m-sad .bod{animation:breathe 4.5s ease-in-out infinite}
/* 포즈 (연출용) */
.p-up .arm{animation:none!important;transform:rotate(150deg)!important}
.p-cheer .arm{animation:cheer .3s ease-in-out infinite alternate!important}
@keyframes cheer{from{transform:rotate(132deg)}to{transform:rotate(160deg)}}
.p-wave .arm.ar{animation:cheer .28s ease-in-out infinite alternate!important}
.p-point .arm.ar{animation:none!important;transform:rotate(100deg)!important}
.p-think .arm.ar{animation:none!important;transform:rotate(-142deg)!important}
.p-phone .arm.ar{animation:none!important;transform:rotate(-168deg)!important}
.p-cover .arm{animation:none!important;transform:rotate(-150deg)!important}
.p-dance .arm.al{animation:armA .3s ease-in-out infinite alternate!important}
.p-dance .arm.ar{animation:cheer .3s ease-in-out infinite alternate!important}
.p-dance .bod{animation:danceb .6s ease-in-out infinite!important}
@keyframes danceb{0%,100%{transform:rotate(-8deg) translateY(0)}25%{transform:rotate(0) translateY(-6px)}50%{transform:rotate(8deg) translateY(0)}75%{transform:rotate(0) translateY(-6px)}}
.p-panic .leg.l{animation:stepA .12s infinite alternate!important}.p-panic .leg.r{animation:stepB .12s infinite alternate!important}
.p-panic .arm{animation:flail .12s infinite alternate!important}
.p-type .arm{animation:typing .12s infinite alternate!important}
@keyframes typing{from{transform:rotate(-40deg)}to{transform:rotate(-52deg)}}
.p-laugh .bod{animation:laughb .16s ease-in-out infinite alternate!important}
@keyframes laughb{to{transform:translateY(-3px) scale(1.02,.98)}}
.p-bowpose .arm{animation:none!important;transform:rotate(-10deg)!important}
/* ---------- 효과 ---------- */
.bubble{transform:translateX(-50%);background:#fff;border:3px solid var(--ink);border-radius:14px;padding:6px 11px;font-size:15px;max-width:62%;width:max-content;z-index:5;animation:bpop .4s cubic-bezier(.2,1.6,.4,1) both;line-height:1.35}
.bubble::after{content:'';position:absolute;left:50%;bottom:-10px;width:14px;height:14px;background:#fff;border-right:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:translateX(-50%) rotate(45deg)}
.bubble.l{transform:translateX(-22%)}.bubble.l::after{left:22%}
.bubble.r{transform:translateX(-78%)}.bubble.r::after{left:78%}
@keyframes bpop{from{opacity:0;scale:.2}to{opacity:1;scale:1}}
.bang{left:50%;top:40%;transform:translate(-50%,-50%);font-size:clamp(40px,10vw,64px);white-space:nowrap;-webkit-text-stroke:4px #1b1b1b;paint-order:stroke fill;text-shadow:4px 5px 0 #1b1b1b;opacity:0;z-index:8;pointer-events:none;letter-spacing:2px}
.bang.good{color:#ffe14d}.bang.bad{color:#ff4d4d}.bang.mid{color:#fff}.bang.heal{color:#7dffb0}
.bang.on{animation:bang 1.25s both}
@keyframes bang{0%{opacity:0;transform:translate(-50%,-50%) scale(3) rotate(-20deg)}18%{opacity:1;transform:translate(-50%,-50%) scale(.9) rotate(-8deg)}28%{transform:translate(-50%,-50%) scale(1.12) rotate(-8deg)}75%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(-8deg)}100%{opacity:0;transform:translate(-50%,-75%) scale(1) rotate(-8deg)}}
#speed{inset:0;z-index:7;pointer-events:none;opacity:0;background:repeating-conic-gradient(from 0deg at 50% 40%,rgba(255,255,255,.75) 0 1.5deg,transparent 1.5deg 8deg);-webkit-mask:radial-gradient(circle at 50% 40%,transparent 20%,#000 65%);mask:radial-gradient(circle at 50% 40%,transparent 20%,#000 65%)}
#speed.on{animation:spd .7s}
@keyframes spd{20%{opacity:1}100%{opacity:0}}
#flash{inset:0;opacity:0;z-index:9;pointer-events:none}
#flash.on{animation:fl .55s}
@keyframes fl{0%{opacity:1}100%{opacity:0}}
#bolt{inset:0;background:#fff;opacity:0;pointer-events:none;z-index:6}
.lightning #bolt{animation:boltf 4s infinite}
@keyframes boltf{0%,88%,92%,100%{opacity:0}89%,93%{opacity:.75}}
#chapter{inset:0;z-index:10;background:var(--chap);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;opacity:0;pointer-events:none;clip-path:circle(0% at 50% 50%)}
#chapter.on{animation:chap 1.45s both}
@keyframes chap{0%{opacity:1;clip-path:circle(0% at 50% 50%)}15%{clip-path:circle(75% at 50% 50%)}75%{opacity:1;clip-path:circle(75% at 50% 50%)}100%{opacity:0;clip-path:circle(75% at 50% 50%)}}
#chapter small{font-size:16px;letter-spacing:6px;color:#ffd166;animation:slam .5s .15s both}
#chapter b{font-size:clamp(26px,7vw,40px);font-weight:normal;margin-top:8px;padding:0 16px;animation:slam .5s .3s both;text-shadow:3px 3px 0 #000}
@keyframes slam{from{opacity:0;transform:scale(2.4)}to{opacity:1;transform:scale(1)}}
.fnum{transform:translateX(-50%);font-size:26px;-webkit-text-stroke:3px #222;paint-order:stroke fill;z-index:8;pointer-events:none;animation:fup 1.5s ease-out forwards;white-space:nowrap}
.fnum.g{color:#7dffb0}.fnum.b{color:#ff5a5a}
@keyframes fup{0%{opacity:0;transform:translate(-50%,10px) scale(.5)}20%{opacity:1;transform:translate(-50%,-10px) scale(1.2)}100%{opacity:0;transform:translate(-50%,-70px) scale(1)}}
.spark{left:50%;top:40%;font-size:22px;z-index:8;pointer-events:none}
.flyer{position:fixed;font-size:26px;z-index:100;pointer-events:none}

/* ---------- 대화창 ---------- */
.box{position:relative;margin-top:16px;background:var(--box);border:3px solid var(--ink);border-radius:20px;padding:20px 18px 18px;box-shadow:0 5px 0 var(--shadow);min-height:150px;cursor:pointer}
.speaker{position:absolute;top:-15px;left:16px;background:var(--c1);color:#fff;border:3px solid var(--ink);border-radius:12px;padding:2px 12px;font-size:15px}
.speaker:empty{display:none}
#text{font-size:18px;line-height:1.7;white-space:pre-line;margin:0;min-height:60px}
.box.typing::after{content:'▼';position:absolute;right:16px;bottom:10px;animation:blink .6s infinite}
.choices{display:grid;gap:10px;margin-top:14px}
.ch{font-family:inherit;font-size:17px;padding:13px 14px;border-radius:16px;border:3px solid var(--ink);background:var(--c1);color:#fff;cursor:pointer;box-shadow:0 4px 0 var(--ink);text-align:left;line-height:1.4;display:flex;gap:10px;align-items:center;animation:rise .45s cubic-bezier(.2,1.4,.4,1) both;transition:transform .1s}
.ch:nth-child(2){background:var(--c2);animation-delay:.1s}
.ch:nth-child(3){background:var(--c3);animation-delay:.2s}
.ch:hover{transform:translateY(-3px) rotate(-.6deg)}
.ch:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.num{flex:none;width:28px;height:28px;border-radius:50%;background:#fff;color:var(--ink);border:2px solid var(--ink);display:grid;place-items:center;font-size:15px}
.ch.wide{justify-content:center;background:var(--wide);color:var(--ink);font-size:20px}
.ch.go{animation:rise .45s both,pulse2 1.2s ease-in-out .6s infinite}
@keyframes pulse2{50%{transform:scale(1.04)}}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.9)}to{opacity:1;transform:none}}
.big{display:inline-block;font-size:clamp(24px,6vw,32px);animation:wig 2s ease-in-out infinite;margin-bottom:8px}
@keyframes wig{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg) scale(1.03)}}
.stats{text-align:center;font-size:17px;background:#fff;border:2px dashed var(--ink);border-radius:12px;padding:8px}
.dex{text-align:center;font-size:15px;line-height:1.9}
.dex span{display:inline-block;font-size:26px;margin:0 4px;filter:grayscale(1);opacity:.45}
.dex span.on{filter:none;opacity:1}
@media (prefers-reduced-motion:reduce){.chr *,.prop,.prop *{animation-duration:0s!important}}

/* ---------- 재미 요소 ---------- */
.status{flex-wrap:wrap}
.chips{display:flex;gap:6px;align-items:center}
@media (max-width:460px){.hpwrap{flex-basis:100%}.chips{width:100%;justify-content:space-between}}
.chip.chance{font-family:inherit;cursor:pointer;background:#fff3b0;color:var(--ink)}
.chip.chance.ready{animation:wob 1s ease-in-out infinite;box-shadow:0 0 0 3px rgba(255,210,63,.6)}
.chip.chance.used{opacity:.4;cursor:default}
@keyframes wob{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg) scale(1.06)}}
#comboB{left:10px;bottom:10px;z-index:7;background:linear-gradient(90deg,#ff7a3d,#ff3b6b);color:#fff;border:2.5px solid var(--ink);border-radius:14px;padding:3px 10px;font-size:15px;display:none;-webkit-text-stroke:0;text-shadow:1px 1px 0 rgba(0,0,0,.3)}

@keyframes flame{50%{transform:scale(1.06) rotate(-2deg)}}
.toast{left:50%;transform:translateX(-50%);background:rgba(20,18,40,.88);color:#fff;padding:6px 14px;border-radius:20px;font-size:15px;z-index:11;white-space:nowrap;pointer-events:none;animation:toast 2.5s forwards}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-16px)}12%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-8px)}}
.ch.gone{animation:gone .6s forwards!important;text-decoration:line-through;cursor:default}
@keyframes gone{to{opacity:.3;transform:scale(.96);filter:grayscale(1)}}
.tip{background:#fffbe0;border:2.5px solid var(--ink);border-radius:14px;padding:10px 12px;animation:flipin .7s cubic-bezier(.2,1.3,.4,1) both;transform-origin:top;box-shadow:0 3px 0 rgba(0,0,0,.15)}

@keyframes flipin{from{opacity:0;transform:perspective(500px) rotateX(-85deg)}to{opacity:1;transform:none}}
#mini{left:0;right:0;top:0;display:none;z-index:9;padding:12px;pointer-events:none}
#mini.on{display:block}
.mg-card{background:rgba(255,255,255,.94);border:3px solid var(--ink);border-radius:16px;padding:10px 12px;box-shadow:0 4px 0 var(--ink);animation:bpop .4s both}
.mg-title{text-align:center;font-size:20px;margin-bottom:8px}
.mg-bar{position:relative;height:24px;border:3px solid var(--ink);border-radius:12px;background:#eee;overflow:hidden}
.mg-bar #mgFill{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#ffd23f,#ff7a3d);transition:width .08s}
.mg-bar .zone{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(45deg,#5ee08a 0 8px,#3fcf75 8px 16px)}

.mg-time{height:9px;margin-top:7px;background:#ddd;border-radius:5px;overflow:hidden}
.mg-time i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff5f7e,#ffb36b)}
.ch.mash{font-size:26px!important;padding:22px!important;user-select:none;-webkit-user-select:none;touch-action:manipulation;background:linear-gradient(#ff8a65,#e8453c)!important;color:#fff!important;animation:pulse2 .6s ease-in-out infinite}
.choices.grid{grid-template-columns:1fr 1fr}
.ch.spot{justify-content:center;text-align:center;font-size:16px;background:#fff!important;color:var(--ink)!important}
.ch.right{background:#2fb383!important;color:#fff!important;animation:cpop .5s}
.ch.wrong{background:#ff6b6b!important;color:#fff!important;animation:rshake .5s}
.r-hop .rx{animation:rhop .2s}
@keyframes rhop{50%{transform:translateY(-14px) scale(1.06,.94)}}
.hint{display:inline-block;font-size:14px;opacity:.8;margin-top:6px;line-height:1.6}
.report{display:flex;gap:16px;align-items:center;justify-content:center;background:#fff;border:2.5px dashed var(--ink);border-radius:14px;padding:12px}
.grade{flex:none;width:92px;height:92px;border-radius:50%;border:5px double #e8453c;color:#e8453c;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:46px;line-height:1;transform:rotate(-12deg);animation:stamp .55s cubic-bezier(.2,1.6,.4,1) both;background:rgba(255,255,255,.6)}
.grade small{font-size:11px;margin-top:2px}
.grade.g-S{color:#d4a017;border-color:#d4a017;text-shadow:0 0 8px rgba(255,210,63,.8)}
.grade.g-A{color:#2b6ea8;border-color:#2b6ea8}.grade.g-B{color:#2fb383;border-color:#2fb383}
@keyframes stamp{from{opacity:0;transform:rotate(-30deg) scale(3)}to{opacity:1;transform:rotate(-12deg) scale(1)}}
.rstats{font-size:16px;line-height:1.75}
.sect{font-size:16px;margin-top:4px}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.badge2{position:relative;background:#fff;border:2px solid var(--ink);border-radius:12px;padding:6px 4px;text-align:center;font-size:12.5px;word-break:keep-all;opacity:.4;filter:grayscale(1);line-height:1.3}
.badge2 i{font-style:normal;font-size:24px;display:block}
.badge2 small{display:block;font-size:10.5px;opacity:.75}
.badge2.on{opacity:1;filter:none;background:#fffbe0}
.badge2.new{animation:newb .8s ease-in-out 3}
@keyframes newb{50%{transform:translateY(-4px) scale(1.05)}}
.badge2 em{position:absolute;top:-8px;right:-6px;background:#e8453c;color:#fff;font-style:normal;font-size:10px;padding:1px 5px;border-radius:8px}
.dex{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
.dex span{display:flex;flex-direction:column;align-items:center;font-size:26px;margin:0;width:74px}
.dex span small{font-size:11px;line-height:1.2;text-align:center}
.notes{background:#fff;border:2px solid var(--ink);border-radius:12px;padding:8px 12px;cursor:default}
.notes summary{cursor:pointer;font-size:16px}
.notes ol{margin:8px 0 0;padding-left:20px;font-size:14px;line-height:1.6}
.notes li{margin-bottom:6px}.notes li b{font-weight:normal;color:#c2410c}.notes li.lock{opacity:.5}
#world>*{position:absolute}
#dim{inset:0;background:radial-gradient(circle at 50% 70%,rgba(0,0,0,.15),rgba(0,0,0,.65));opacity:0;transition:opacity .5s;pointer-events:none;z-index:4}
#dim.on{opacity:1}
.bubble{z-index:6}
.spark{z-index:8}
/* ===== AI 3D 배경 ===== */
#sky{container-type:size;overflow:hidden}
#bgimg{position:absolute;left:50%;bottom:0;width:max(100cqw,177.78cqh);background-repeat:no-repeat;transform-origin:50% 85%;animation:kb 26s ease-in-out infinite alternate;display:none}
@keyframes kb{from{transform:translateX(-50%) scale(1)}to{transform:translateX(-51.6%) scale(1.06)}}
#sky::after{content:'';position:absolute;inset:0;background:linear-gradient(transparent 70%,rgba(0,0,0,.12));pointer-events:none}
/* ===== AI 3D 캐릭터 ===== */
.actor.img .pic{position:relative;width:100%;transform-origin:50% 100%;animation:ibreathe 3.2s ease-in-out infinite}
.actor.img .pic::before{content:'';position:absolute;left:12%;right:12%;bottom:-3.5%;height:9%;background:radial-gradient(closest-side,rgba(0,0,0,.38),transparent);border-radius:50%}
.actor.img .ex{position:absolute;bottom:0;left:50%;height:100%;transform:translateX(-50%);background-repeat:no-repeat;opacity:0;transition:opacity .14s;filter:drop-shadow(0 2px 2px rgba(0,0,0,.18))}
.actor.img .ex-n{opacity:1}
.actor.img.f-happy .ex-n,.actor.img.f-eat .ex-n,.actor.img.f-shock .ex-n,.actor.img.f-sad .ex-n,.actor.img.f-cry .ex-n,.actor.img.f-ko .ex-n,.actor.img.f-angry .ex-n{opacity:0}
.actor.img.f-happy .ex-h,.actor.img.f-eat .ex-h{opacity:1}
.actor.img.f-shock .ex-s,.actor.img.f-sad .ex-s,.actor.img.f-cry .ex-s,.actor.img.f-ko .ex-s,.actor.img.f-angry .ex-s{opacity:1}
.actor.img .efx{position:absolute;right:-6%;top:-4%;font-size:clamp(16px,22%,30px);line-height:1;font-style:normal;pointer-events:none}
.actor.img .efx::after{display:inline-block}
.actor.img.f-shock .efx::after{content:'💦';animation:drip 1.2s ease-in infinite}
.actor.img.m-angry .efx::after,.actor.img.f-angry .efx::after{content:'💢';animation:angp .6s ease-in-out infinite alternate}
.actor.img.m-sleep .efx::after,.actor.img.f-sleep .efx::after{content:'💤';animation:zz 2.6s ease-in-out infinite}
.actor.img.f-cry .efx::after{content:'💧';animation:drip .9s ease-in infinite}
.actor.img.f-ko .efx::after{content:'💫';animation:qbob .5s ease-in-out infinite alternate}
.actor.img.p-think .efx::after{content:'❓';animation:qbob .8s ease-in-out infinite alternate}
.actor.img.f-happy.m-happy .efx::after{content:'✨';animation:qbob 1s ease-in-out infinite alternate}
@keyframes ibreathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.018,.982)}}
@keyframes ihappy{0%,100%{transform:translateY(0) scale(1,1)}20%{transform:translateY(0) scale(1.05,.94)}45%{transform:translateY(-9%) scale(.97,1.04)}70%{transform:translateY(0) scale(1.03,.97)}}
@keyframes ishiv{0%,100%{transform:translateX(0)}25%{transform:translateX(-2.5%)}75%{transform:translateX(2.5%)}}
@keyframes ihuff{0%,100%{transform:scale(1,1)}50%{transform:scale(1.06,.95)}}
@keyframes isway{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
@keyframes isad{0%,100%{transform:translateY(2%) scale(1.01,.96)}50%{transform:translateY(2.5%) scale(1.015,.95)}}
@keyframes isleep{0%,100%{transform:rotate(7deg) scale(1,1)}50%{transform:rotate(7deg) scale(1.03,.97)}}
@keyframes italk{from{transform:scale(1,1) rotate(0)}to{transform:scale(1.035,.965) rotate(-1.5deg)}}
@keyframes iwalk{0%{transform:translateY(0) rotate(calc(var(--lean,0deg) - 4deg)) scale(1.02,.97)}50%{transform:translateY(-8%) rotate(var(--lean,0deg)) scale(.98,1.03)}100%{transform:translateY(0) rotate(calc(var(--lean,0deg) + 4deg)) scale(1.02,.97)}}
@keyframes icheer{0%,100%{transform:translateY(0) scale(1.06,.92)}50%{transform:translateY(-16%) scale(.96,1.06)}}
@keyframes idance{0%,100%{transform:rotate(-10deg) translateY(0)}25%{transform:rotate(0) translateY(-8%)}50%{transform:rotate(10deg) translateY(0)}75%{transform:rotate(0) translateY(-8%)}}
@keyframes iwave{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
.actor.img.m-happy .pic{animation:ihappy 1.1s ease-in-out infinite}
.actor.img.m-tremble .pic{animation:ishiv .12s linear infinite}
.actor.img.m-angry .pic{animation:ihuff .9s ease-in-out infinite}
.actor.img.m-sway .pic{animation:isway 1.4s ease-in-out infinite}
.actor.img.m-sad .pic{animation:isad 4s ease-in-out infinite}
.actor.img.m-sleep .pic{animation:isleep 4s ease-in-out infinite}
.actor.img.talk .pic{animation:italk .16s ease-in-out infinite alternate}
.actor.img.p-cheer .pic,.actor.img.p-up .pic{animation:icheer .42s ease-in-out infinite}
.actor.img.p-dance .pic{animation:idance .7s ease-in-out infinite}
.actor.img.p-panic .pic{animation:ishiv .09s linear infinite}
.actor.img.p-wave .pic{animation:iwave .25s ease-in-out infinite alternate}
.actor.img.p-think .pic,.actor.img.p-phone .pic{animation:none;transform:rotate(5deg)}
.actor.img.p-point .pic{animation:none;transform:rotate(-6deg) translateX(3%)}
.actor.img.walk .pic{animation:iwalk .34s ease-in-out infinite alternate}
.actor.img.run .pic{animation-duration:.17s}

 },
 title:{bg:'glacier',a:[['pen',34,'happy',0,1.15],['#ice',68,'idle',0,1]],in:'a 0 wave',t:'🐧 펭귄상사 : 얼음 사막 대작전',d:'망해가는 남극 무역회사의 신입 펭돌이.\n사막 왕국에 얼음을 팔고, 북극곰의 음모를 막아라!'},
 scenes:[
  {id:'s1',t:'파산 직전의 펭귄상사',bg:'office',a:[['pen',28,'tremble'],['boss',72,'angry',1,1.15]],in:'a 1 stomp',n:'사장 펭귄',b:'두둥!',s:[1,'통장에 남은 건 얼음 한 조각뿐이다!!'],
   d:`남극 최대(였던) 무역회사 '펭귄상사'.\n사장님이 마지막 남은 얼음 조각을 책상에 내리쳤다.\n"펭돌아… 회사의 운명을 너에게 맡기마. 사막 왕국에 얼음을 팔아와!"`,
   c:[[`📊 밤새 시장조사 보고서를 파고든다`,-5,2,`사막 왕국 '모래모래'의 평균 기온 48도! 얼음 수입 수요가 폭발 직전이라는 결정적 데이터를 찾았다.`,'p laptop 47 .9|a 0 type|s 0 평균 48도?! 얼음이 금값이겠다!|a 0 jump|a 1 nod'],
      [`⛏️ 말보다 행동! 얼음부터 캐러 뛰어나간다`,-20,0,`신나게 얼음을 캤지만… 누구한테 팔지 모른다. 손발이 꽁꽁 얼어붙었다.`,'a 0 panic|w 0 -25 run|t 600|w 0 30|p ice 46 .6|a 0 shiver|s 1 …그래서 누구한테 팔 건데?|a 0 faint'],
      [`🦭 옆자리 물개 선배를 붙잡고 묻는다`,-10,1,`물개 선배가 속삭였다. "거기 왕자님이 빙수에 미쳐있대." 쓸만한 소문 획득!`,'e seal 52 1 idle .95|s 2 쉿, 거기 왕자님이 빙수에 미쳐있대~|a 0 nod']]},
  {id:'s2',t:'북극에서 온 악당',bg:'glacier',a:[['pen',25,'idle'],['polar',72,'angry',1,1.25]],in:'f shake|a 1 grow',n:'북극곰 사장',b:'쿠궁!!',s:[1,'크하하! 사막 얼음 시장은 우리 거다!'],
   d:`그때 빙하가 쩍 갈라지며 거대한 그림자가 나타났다.\n북극 최대 무역회사 '폴라베어무역'의 사장, 북극곰!\n"꼬맹이 펭귄 따위가 감히 우리 시장에?"`,
   c:[[`😤 "한판 붙자!" 날개를 휘두른다`,-25,0,`북극곰이 콧바람 한 번 불었을 뿐인데, 펭돌이는 빙하 저편으로 날아갔다. 북극곰의 눈에 원한이 서렸다.`,'w 0 52 run|a 1 stomp|a 0 flyaway|w 0 25|m 0 sad|s 1 두고 보자, 꼬맹이!',{set:'feud'}],
      [`🕵️ 북극곰 회사의 약점부터 조사한다`,-5,2,`폴라베어무역의 얼음엔 품질 인증서가 없다! 결정적 약점 발견.`,'a 0 think|p doc 46 .8|s 0 폴라베어 얼음엔 품질 인증이 없다!|a 0 jump|a 1 shake',{set:'intel'}],
      [`🏃 무시하고 바이어에게 먼저 연락한다`,-10,1,`선수 필승! 하지만 북극곰의 눈빛이 영 찜찜하다…`,'a 0 phone|s 0 여보세요, 모래모래 왕국이죠?|a 1 point']]},
  {id:'s3',t:'사막의 왕자',bg:'palace',a:[['pen',25,'tremble'],['camel',72,'idle',1,1.15]],n:'낙타 왕자',b:'짜잔~!',s:[1,'조건은 DDP! 궁전 앞까지, 관세도 네가 내~'],
   d:`사막 왕국 모래모래의 황금 궁전.\n황금 쿠션 위의 낙타 왕자가 하품을 하며 말했다.\n"얼음이라… 조건만 맞으면 사주지." 등 뒤로 식은땀이 흐른다.`,
   c:[[`😇 "넵! DDP 좋습니다!" 즉시 수락`,-25,0,`사막 관세, 내륙 운송비, 궁전 배달까지 전부 펭귄 부담… 이익이 녹아내린다.`,'a 0 nod|p moneybag 50 .8|s 1 관세랑 배달비도 전부 네 몫~|a 0 faint'],
      [`🚢 "FOB 조건은 어떠세요?" 차분히 역제안`,-5,2,`배에 싣는 순간까지만 책임지는 조건으로 합의! 리스크가 확 줄었다.`,'a 0 point|s 0 배에 싣는 순간까지만 책임질게요!|a 1 think|a 1 nod|a 0 cheer'],
      [`🎲 "가위바위보로 정하시죠!"`,-15,1,`펭귄 날개로는 '보'밖에 못 낸다. 졌지만 CIF로 겨우 타협했다.`,'s 0 가위바위보!|a 0 shake|a 1 laugh|a 0 sad']]},
  {id:'s4',t:'출항! 운명의 컨테이너',bg:'sea',a:[['pen',26,'happy'],['seal',74,'idle',1,1.05],['#ice',50,'idle',0,.8]],in:'a 0 cheer',n:'물개 선장',s:[1,'근데 얼음… 뭐에 담아갈 거냐?'],
   d:`드디어 출항! 부두에서 동료 펭귄들이 손수건을 흔든다.\n하지만 이 배는 적도를 지나 48도 사막까지 간다.\n얼음을 어떻게 지킬 것인가?`,
   c:[[`🙏 스티로폼 박스 + 간절한 기도`,-20,0,`기도에는 온도 유지 기능이 없는 것으로 밝혀졌다.`,'p styro 40 .9|a 0 bow|s 1 기도엔 냉장 기능이 없단다…|a 0 cry'],
      [`🧣 펭귄 털 담요로 꽁꽁 싸맨다`,-15,1,`포근하다… 근데 그건 얼음을 따뜻하게 만드는 거잖아?!`,'a 0 hide|s 1 그건 얼음을 데우는 거잖아!|a 0 shake'],
      [`🧊 리퍼(냉동) 컨테이너를 예약한다`,-10,2,`영하 18도 유지 완료! 운임은 비싸지만 얼음은 안전하다.`,'p reefer 60 .75|a 1 nod|s 1 영하 18도, 완벽하군!|a 0 cheer']]},
  {id:'s5',t:'폭풍의 바다',bg:'storm',a:[['pen',30,'tremble'],['seal',70,'sway',1,1.05]],in:'f bolt|a 1 panic',n:'물개 선장',b:'콰르릉!!',s:[1,'컨테이너가 미끄러진다!! 펭돌아!!!'],
   d:`적도 근처, 하늘이 순식간에 시커멓게 변했다.\n집채만 한 파도가 배를 때리고, 갑판 위 컨테이너들이 비명을 지른다.\n그중 하나가… 펭돌이의 얼음이다!`,
   c:[[`📞 사장님께 울면서 전화한다`,-15,1,`"적하보험 들어놨지?" 사장님의 한마디에 정신이 번쩍 들었다.`,'a 0 phone|s 0 사장니임~ 배가 막 흔들려요!|a 0 cry'],
      [`⛓️ 선원들과 고박(래싱) 상태를 점검하고 다시 묶는다`,-10,2,`느슨해진 래싱 바를 발견해 단단히 고정! 컨테이너 사수 성공.`,'p rope 50 .9|w 0 44|a 0 panic|a 1 nod|a 0 jump'],
      [`💃 무서울 땐 춤을 춘다`,-25,0,`파도에 휩쓸려 갑판을 세 바퀴 굴렀다. 정신이 혼미하다.`,'a 0 dance|f bolt|a 0 slip']]},
  {id:'s6',t:'수상한 검은 배',bg:'pirate',a:[['pen',24,'idle'],['polar',76,'angry',1,1.2]],in:'a 1 laugh',n:'북극곰 사장',b:'두둥!!',s:[1,'그 얼음 반값에 넘기시지? 전원 코드가 어떻게 될지 몰라~'],

   d:`폭풍이 지나간 밤, 해적 깃발을 단 검은 배가 슬그머니 다가왔다.\n갑판 위에 선 건… 북극곰!\n그리고 펭돌이의 냉동 컨테이너 온도가 조금씩 올라가고 있다?!`,

 s7:{k:'HS코드',d:'전 세계 공통으로 쓰는 품목분류 번호예요(앞 6자리가 국제 공통). 관세율과 수입 요건이 이 번호로 정해지고, 물·얼음·눈은 제2201호예요. 잘못 신고하면 가산세나 제재를 받을 수 있어요.'},

 s9:{k:'신용장(L/C)',d:'수입자의 거래은행이 "서류가 조건과 일치하면 대금을 지급하겠다"고 약속하는 결제 방식이에요. 수출자는 대금을 못 받을 위험을 크게 줄일 수 있어요.'}

/* ================= 배경음악 엔진 (WebAudio 합성) =================
 G.bgm = {tempo, key:'C', scale:'major|minor|penta|minpenta|harm|dorian', chords:'C Am F G ...'(한 마디당 1개),
          bar:16|12, swing:0~.3, lead:'square|saw|pluck|bell|piano|accordion|brass|flute|synth',
          bass:'bass|sub|synbass|walk|tuba', comp:'arp|stab|pad|oom|strum|piano|none', compInst, drums:'pop|rock|jazz|waltz|march|synth|trap|lofi|folk|none',
          density:.45, seed:1, oct:5, vol:1 } */
const MUS={on:false,next:0,step:0,timer:null,out:null,noise:null,song:null};
const SCALES={major:[0,2,4,5,7,9,11],minor:[0,2,3,5,7,8,10],harm:[0,2,3,5,7,8,11],dorian:[0,2,3,5,7,9,10],penta:[0,2,4,7,9],minpenta:[0,3,5,7,10],mixo:[0,2,4,5,7,9,10]};
const NOTE={C:0,'C#':1,Db:1,D:2,'D#':3,Eb:3,E:4,F:5,'F#':6,Gb:6,G:7,'G#':8,Ab:8,A:9,'A#':10,Bb:10,B:11};
const QUAL={'':[0,4,7],m:[0,3,7],'7':[0,4,7,10],maj7:[0,4,7,11],m7:[0,3,7,10],dim:[0,3,6],sus4:[0,5,7],sus2:[0,2,7],add9:[0,4,7,14],m9:[0,3,7,10,14],'6':[0,4,7,9],m6:[0,3,7,9]};
const mid2f=m=>440*Math.pow(2,(m-69)/12);
function parseChord(s){const m=/^([A-G][#b]?)(.*)$/.exec(s);return {root:NOTE[m[1]],tones:QUAL[m[2]]||QUAL['']};}
function rng(seed){let s=seed>>>0||1;return()=>{s^=s<<13;s>>>=0;s^=s>>17;s^=s<<5;s>>>=0;return s/4294967296;};}

function compose(B){const R=rng(B.seed||7),bar=B.bar||16,chords=B.chords.trim().split(/\s+/).map(parseChord),key=NOTE[B.key||'C'],sc=SCALES[B.scale||'major'],oct=B.oct||5;
 const deg2m=d=>{const o=Math.floor(d/sc.length),i=((d%sc.length)+sc.length)%sc.length;return 12*(oct+1)+key+sc[i]+12*o;};
 const nearestChordDeg=(d,ch)=>{let best=d,bd=99;for(let k=d-4;k<=d+4;k++){const pc=(deg2m(k)-ch.root+1200)%12;if(ch.tones.some(t=>t%12===pc)&&Math.abs(k-d)<bd){bd=Math.abs(k-d);best=k;}}return best;};
 const dens=B.density||.45,W=bar===12?[1,.2,.5,.2,.8,.2,.5,.2,.8,.2,.5,.3]:[1,.15,.45,.2,.75,.15,.45,.25,.9,.15,.45,.2,.75,.2,.5,.3];
 // 2마디 모티프 리듬
 const mkRhythm=()=>{const on=[];for(let s=0;s<bar*2;s++){const w=W[s%bar];if(s===0||R()<w*dens*1.25)on.push(s);}return on;};
 const mkPhrase=(rh,startDeg,barIdx,cad)=>{const out=[];let d=startDeg;rh.forEach((s,i)=>{const ch=chords[(barIdx+Math.floor(s/bar))%chords.length];
   if(R()<.68)d+=R()<.5?1:-1;else if(R()<.5)d+=R()<.5?2:-2;else d+=R()<.5?3:-3;d=Math.max(-3,Math.min(9,d));
   if(s%(bar/2)===0)d=nearestChordDeg(d,ch);
   const nx=i<rh.length-1?rh[i+1]:bar*2;let len=Math.min(nx-s,6);if(cad&&i===rh.length-1){d=nearestChordDeg(0,ch);len=nx-s;}
   out.push([s,deg2m(d),len]);});return out;};
 const A=mkRhythm(),Bm=mkRhythm(),Cm=mkRhythm(),nb=chords.length,mel=[],NB=Math.max(16,nb);
 const sec=[[A,0,false],[A,1,false],[Bm,3,false],[A,0,true],[Cm,2,false],[Cm,4,false],[Bm,3,false],[A,0,true]];
 for(let b=0;b<NB;b+=2){const [rh,sd,cad]=sec[(b/2)%8];const last=(b+2>=NB);mkPhrase(rh,sd,b,cad||last).forEach(([s,m,l])=>mel.push([b*bar+s,m,l]));}
 return {chords,mel,bars:NB,bar};}

function musInit(){if(MUS.out)return MUS.out;const c=AC.createDynamicsCompressor();c.threshold.value=-18;c.ratio.value=3;const g=AC.createGain();g.gain.value=.3*(G.bgm&&G.bgm.vol||1);c.connect(g);g.connect(AC.destination);MUS.out=c;MUS.gain=g;
 const b=AC.createBuffer(1,AC.sampleRate*.6,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;MUS.noise=b;return c;}
function env(g,t,a,peak,dec,sus,rel,dur){g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(Math.max(.0001,peak*sus),t+a+dec);g.gain.setValueAtTime(Math.max(.0001,peak*sus),t+Math.max(a+dec,dur));g.gain.exponentialRampToValueAtTime(.0001,t+Math.max(a+dec,dur)+rel);}
function osc(type,f,t,end,dest,detune){const o=AC.createOscillator();o.type=type;o.frequency.setValueAtTime(f,t);if(detune)o.detune.value=detune;o.connect(dest);o.start(t);o.stop(end+.05);return o;}
function inst(name,t,f,dur,v){const out=MUS.out,g=AC.createGain();let flt=null,end=t+dur+.6;
 const lp=(fr,q)=>{flt=AC.createBiquadFilter();flt.type='lowpass';flt.frequency.setValueAtTime(fr,t);flt.Q.value=q||.7;flt.connect(g);return flt;};
 g.connect(out);
 switch(name){
  case 'square':{const d=lp(2600);osc('square',f,t,end,d);env(g,t,.005,v*.5,.12,.55,.08,dur);break;}
  case 'saw':case 'synth':{const d=lp(2400,4);flt.frequency.exponentialRampToValueAtTime(700,t+dur+.1);osc('sawtooth',f,t,end,d,-6);osc('sawtooth',f,t,end,d,6);env(g,t,.01,v*.32,.15,.6,.1,dur);break;}
  case 'pluck':{const d=lp(3200);flt.frequency.exponentialRampToValueAtTime(400,t+.35);osc('triangle',f,t,end,d);osc('square',f*2,t,end,d);env(g,t,.003,v*.42,.3,.08,.25,.02);break;}
  case 'bell':{osc('sine',f,t,end,g);const h=AC.createGain();h.gain.value=.35;h.connect(g);osc('sine',f*2.76,t,end,h);osc('sine',f*5.4,t,end,h);env(g,t,.003,v*.42,.9,.05,.6,.02);break;}
  case 'piano':{const d=lp(3000);flt.frequency.exponentialRampToValueAtTime(900,t+.6);osc('triangle',f,t,end,d);osc('sine',f*2,t,end,d,4);env(g,t,.004,v*.55,.7,.12,.35,dur*.6);break;}
  case 'accordion':{const d=lp(2200,1.5);osc('sawtooth',f,t,end,d,-9);osc('sawtooth',f,t,end,d,9);osc('square',f/2,t,end,d);env(g,t,.04,v*.22,.1,.85,.12,dur);break;}
  case 'brass':{const d=lp(500,2);flt.frequency.linearRampToValueAtTime(2600,t+.06);flt.frequency.exponentialRampToValueAtTime(1300,t+dur);osc('sawtooth',f,t,end,d);osc('sawtooth',f,t,end,d,8);env(g,t,.04,v*.3,.1,.75,.1,dur);break;}
  case 'flute':{const o=osc('sine',f,t,end,g);const l=AC.createOscillator(),lg=AC.createGain();l.frequency.value=5.5;lg.gain.value=f*.012;l.connect(lg);lg.connect(o.frequency);l.start(t);l.stop(end);osc('triangle',f*2,t,end,(()=>{const h=AC.createGain();h.gain.value=.12;h.connect(g);return h;})());env(g,t,.06,v*.45,.1,.8,.12,dur);break;}
  case 'pad':{const d=lp(1100);osc('sawtooth',f,t,end+.4,d,-12);osc('sawtooth',f,t,end+.4,d,12);osc('triangle',f/2,t,end+.4,d);env(g,t,.25,v*.13,.3,.8,.5,dur);break;}
  case 'organ':{osc('sine',f,t,end,g);osc('sine',f*2,t,end,g);osc('sine',f*3,t,end,(()=>{const h=AC.createGain();h.gain.value=.4;h.connect(g);return h;})());env(g,t,.01,v*.18,.05,.9,.08,dur);break;}
  case 'koto':{const d=lp(4000);flt.frequency.exponentialRampToValueAtTime(600,t+.5);osc('sawtooth',f,t,end,d);env(g,t,.002,v*.35,.5,.05,.4,.02);break;}
  case 'bass':{const d=lp(900);osc('triangle',f,t,end,d);osc('sine',f/2,t,end,d);env(g,t,.005,v*.9,.25,.5,.08,dur);break;}
  case 'sub':{osc('sine',f,t,end,g);env(g,t,.01,v*.95,.2,.7,.1,dur);break;}
  case 'synbass':{const d=lp(1400,6);flt.frequency.exponentialRampToValueAtTime(220,t+.18);osc('sawtooth',f,t,end,d);osc('square',f/2,t,end,d);env(g,t,.004,v*.42,.18,.4,.06,dur);break;}
  case 'walk':{const d=lp(700);osc('triangle',f,t,end,d);osc('sine',f,t,end,d);env(g,t,.004,v*.95,.35,.2,.1,.02);break;}
  case 'tuba':{const d=lp(600,1);osc('sawtooth',f,t,end,d);osc('sine',f,t,end,d);env(g,t,.02,v*.5,.15,.6,.08,dur);break;}
 }}
function drum(k,t,v){const out=MUS.out,g=AC.createGain();g.connect(out);
 if(k==='k'){const o=AC.createOscillator();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(42,t+.14);o.connect(g);o.start(t);o.stop(t+.3);env(g,t,.002,v*1.1,.22,.01,.05,.01);return;}
 const n=AC.createBufferSource();n.buffer=MUS.noise;const f=AC.createBiquadFilter();n.connect(f);f.connect(g);
 if(k==='s'){f.type='bandpass';f.frequency.value=1800;f.Q.value=.7;env(g,t,.002,v*.55,.16,.01,.05,.01);const o=AC.createOscillator();o.frequency.setValueAtTime(220,t);o.frequency.exponentialRampToValueAtTime(120,t+.08);const og=AC.createGain();og.gain.setValueAtTime(v*.35,t);og.gain.exponentialRampToValueAtTime(.001,t+.1);o.connect(og);og.connect(out);o.start(t);o.stop(t+.12);}
 else if(k==='c'){f.type='bandpass';f.frequency.value=1200;f.Q.value=1.2;env(g,t,.002,v*.6,.12,.01,.04,.01);}
 else if(k==='h'){f.type='highpass';f.frequency.value=7500;env(g,t,.001,v*.22,.04,.01,.02,.01);}
 else if(k==='o'){f.type='highpass';f.frequency.value=6500;env(g,t,.001,v*.2,.25,.05,.05,.01);}
 else if(k==='r'){f.type='highpass';f.frequency.value=5000;env(g,t,.001,v*.15,.9,.05,.1,.01);}
 else if(k==='b'){f.type='bandpass';f.frequency.value=3200;f.Q.value=4;env(g,t,.001,v*.35,.03,.01,.02,.01);}
 else if(k==='t'){f.type='lowpass';f.frequency.value=500;env(g,t,.002,v*.7,.22,.01,.05,.01);const o=AC.createOscillator();o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(80,t+.2);const og=AC.createGain();og.gain.setValueAtTime(v*.5,t);og.gain.exponentialRampToValueAtTime(.001,t+.25);o.connect(og);og.connect(out);o.start(t);o.stop(t+.3);}
 n.start(t,Math.random()*.3);n.stop(t+1);}
const DRUMS={ // 16스텝(4/4) · 12스텝(3/4)
 pop:{k:'k.......k.k.....',s:'....s.......s...',h:'h.h.h.h.h.h.h.h.'},
 rock:{k:'k.....k.k.......',s:'....s.......s...',h:'h.h.h.h.h.h.h.ho'},
 synth:{k:'k...k...k...k...',c:'....c.......c...',h:'..h...h...h...h.',o:'..............o.'},
 trap:{k:'k......k..k.....',c:'........c.......',h:'h.hhh.h.h.hhh.hh'},
 jazz:{k:'k.........k.....',r:'r...r.r.r...r.r.',b:'....b.......b...'},
 lofi:{k:'k......k..k.....',s:'....s.......s...',h:'..h...h...h...h.'},
 march:{k:'k.......k.......',s:'....s.s.....s.ss',t:'..............t.'},
 folk:{k:'k.......k.......',b:'....b..b....b...',h:'..h...h...h...h.'},
 waltz:{k:'k...........',s:'....s...s...',h:'..h...h...h.'},
 waltzk:{k:'k...........',b:'....b...b...'},
 tension:{k:'k..k..k.k..k..k.',h:'h.h.h.h.h.h.h.h.',t:'............t.t.'},
 none:{}};
const COMP={ // 반주 리듬 (스텝 위치)
 arp:{steps:'x.x.x.x.x.x.x.x.',mode:'arp'},stab:{steps:'..x...x...x...x.',mode:'chord'},pad:{steps:'x...............',mode:'hold'},
 oom:{steps:'....x.......x...',mode:'chord'},strum:{steps:'x..x..x...x.x...',mode:'chord'},piano:{steps:'x.....x...x.....',mode:'chord'},
 oom3:{steps:'....x...x...',mode:'chord'},arp3:{steps:'x.x.x.x.x.x.',mode:'arp'},none:{steps:'',mode:''}};
const BASSPAT={bass:'x.......x.......',sub:'x.........x.....',synbass:'x.x.x.x.x.x.x.x.',walk:'x...x...x...x...',tuba:'x.......x.......',tuba3:'x...........',bass3:'x...........',octave:'x.......x.x.....'};

function bgmStart(){if(!G.bgm||MUS.on)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
 if(AC.state==='suspended')AC.resume();musInit();MUS.song=MUS.song||compose(G.bgm);MUS.on=true;MUS.step=0;MUS.next=AC.currentTime+.12;
 clearInterval(MUS.timer);MUS.timer=setInterval(musTick,40);}
function bgmStop(){MUS.on=false;clearInterval(MUS.timer);MUS.timer=null;}
function musTick(){if(!MUS.on||!AC)return;const B=G.bgm,S=MUS.song,bar=S.bar,sp=60/B.tempo/4,tot=S.bars*bar;
 while(MUS.next<AC.currentTime+.18){const st=MUS.step%tot,bi=Math.floor(st/bar),s=st%bar;let t=MUS.next;if(B.swing&&s%2===1)t+=sp*B.swing;
  if(sMode===0)playStep(B,S,st,bi,s,t,sp);MUS.step++;MUS.next+=sp;}}
function playStep(B,S,st,bi,s,t,sp){const ch=S.chords[bi%S.chords.length],root=12*3+(ch.root+NOTE[B.key||'C']*0)%12;
 // 드럼
 const dp=DRUMS[B.drums||'pop']||{};if(B.drums!=='none'&&bi%8===7&&s>=S.bar-4&&s%1===0){drum('t',t,.45);}for(const k in dp){const p=dp[k];if(p[s%p.length]&&p[s%p.length]!=='.'){const kk=p[s%p.length]==='o'&&k!=='o'?'o':k;drum(kk==='hh'?'h':kk,t,.55*(B.dvol||1));}}
 // 베이스
 const bpk=(B.bassPat||B.bass||'bass')+(S.bar===12&&!B.bassPat?'3':''),bp=BASSPAT[bpk]||BASSPAT.bass;
 if(bp[s]==='x'){let n=root+12*(B.bassOct||0);if(B.bass==='walk'){const tones=[0,ch.tones[1],ch.tones[2],ch.tones[1]+ (ch.tones[1]===4?1:2)];n+=tones[(s/4)%4|0]%12;}
  else if((B.bassPat==='octave'||B.bass==='synbass')&&s%4===2)n+=12;else if(s>=S.bar/2&&B.bass!=='synbass'&&B.bass!=='sub')n+=ch.tones[2]%12===7?7:ch.tones[2];
  inst(B.bass==='tuba'?'tuba':B.bass||'bass',t,mid2f(n),sp*(B.bass==='synbass'?1.6:3.5),.5);}
 // 반주
 const cp=COMP[(B.comp||'arp')+(S.bar===12&&['oom','arp'].includes(B.comp)?'3':'')]||COMP.arp;
 if(cp.steps[s]==='x'){const base=12*4+ch.root;const ci=B.compInst||'pluck';
  if(cp.mode==='arp'){const seq=[0,1,2,1];const tn=ch.tones[seq[(s/2|0)%4]%ch.tones.length];inst(ci,t,mid2f(base+tn+(s%8>=6?12:0)),sp*1.8,.22);}
  else if(cp.mode==='hold')ch.tones.slice(0,4).forEach(tn=>inst(B.padInst||'pad',t,mid2f(base+tn),sp*S.bar*.95,.28));
  else ch.tones.slice(0,3).forEach((tn,i)=>inst(ci,t+i*(B.comp==='strum'?.012:0),mid2f(base+tn),sp*1.6,.17));}
 if(B.pad&&s===0)ch.tones.slice(0,3).forEach(tn=>inst('pad',t,mid2f(12*4+ch.root+tn),sp*S.bar*.95,.22));
 // 멜로디 (8마디 중 앞 4마디는 1회차에 쉼표 없이, 반복 시 그대로)
 for(const [ms,m,l] of S.mel)if(ms===st)inst(B.lead||'square',t,mid2f(m),sp*l*.92,.3*(B.lvol||1));}

/* ================= 미니게임 =================

let mgCheat=null,mgKey=null;
function mini(m){busy=true;mgTotal++;clearBubble();const ov=$('#mini');let done=false,raf=0,t0=0,timers=[];
 const big=['catch','memory','sort','rhythm','ox'].includes(m.type);

 if(big)ov.innerHTML=`<div class="mg-field mg-${m.type}"><div class="mg-head"><b class="mg-title">${m.t}</b><span class="mg-score" id="mgScore"></span></div><div class="mg-time"><i id="mgTime"></i></div><div class="mg-play" id="mgPlay"></div></div>`;
 else ov.innerHTML=`<div class="mg-card"><div class="mg-title">${m.t}</div>${m.type==='spot'?'':`<div class="mg-bar"><i id="mgFill"></i>${m.type==='timing'?`<b class="zone" style="left:${m.zone[0]*100}%;width:${(m.zone[1]-m.zone[0])*100}%"></b><s id="needle"></s>`:''}</div>`}${m.type==='timing'?'':'<div class="mg-time"><i id="mgTime"></i></div>'}</div>`;
 ov.className='on'+(big?' big':'');
 const score=s=>{const e=$('#mgScore');if(e)e.textContent=s;};
 const finish=async(win,picked)=>{if(done)return;done=true;keyLock=performance.now()+1600;cancelAnimationFrame(raf);timers.forEach(clearTimeout);timers.forEach(clearInterval);mashTap=null;mgCheat=null;
  if(mgKey){document.removeEventListener('keydown',mgKey,true);document.removeEventListener('keyup',mgKey,true);mgKey=null;}$$('#choices .ch').forEach(b=>b.disabled=true);
  if(m.type==='spot')$$('#choices .ch').forEach(b=>{if(+b.dataset.k===m.ans)b.classList.add('right');else if(+b.dataset.k===picked)b.classList.add('wrong');});
  if(win){mgWin++;hp=Math.min(100,hp+10);clue+=1;status(clue-1);bang(m.wb||'퍼펙트!','good');SFX.good();flash('rgba(255,230,120,.5)');burst(16,['✨','⭐','🎉']);floatNum('+10 ❤️',true);flyClue(1);act(A[0],'cheer');}
  else{hp=Math.max(0,hp-5);status();bang(m.lb||'아깝다!','bad');SFX.bad();floatNum('-5 ❤️',false);act(A[0],'shake');}
  await wait(m.type==='spot'?1100:900);ov.className='';ov.innerHTML='';$('#choices').classList.remove('grid');$('#speaker').textContent='결과';type(win?m.win:m.lose,nextButton);};
 mgCheat=()=>finish(true);
 const timeBar=sec=>{const el=(performance.now()-t0)/1000,tb=$('#mgTime');if(tb)tb.style.width=Math.max(0,1-el/sec)*100+'%';return el;};
 const tick=(sec,onEnd)=>{const loop=()=>{if(done)return;if(timeBar(sec)>=sec)return onEnd();raf=requestAnimationFrame(loop);};loop();};
 const pad=(labels)=>{$('#choices').classList.add('grid');$('#choices').innerHTML=labels.map((t,k)=>`<button class="ch spot big-pad" data-k="${k}">${t}</button>`).join('');};
 type(m.d,()=>{
  if(m.type==='mash')$('#choices').innerHTML=`<button class="ch wide mash">👊 ${m.btn||'연타!!'}</button>`;
  if(m.type==='timing')$('#choices').innerHTML=`<button class="ch wide mash">✋ ${m.btn||'멈춰!'}</button>`;
  if(m.type==='rhythm')$('#choices').innerHTML=`<button class="ch wide mash">${m.icon||'🥁'} 지금!</button>`;
  if(m.type==='spot'){$('#choices').classList.add('grid');$('#choices').innerHTML=shuffle(m.items.map((t,k)=>[t,k])).map(([t,k])=>`<button class="ch spot" data-k="${k}">${t}</button>`).join('');}
  if(m.type==='sort')pad(m.bins.map((b,i)=>`${i?'▶':'◀'} ${b}`));
  if(m.type==='ox')pad(['⭕ 맞다','❌ 아니다']);
  if(m.type==='catch')$('#choices').innerHTML=`<p class="mg-help">👆 화면을 터치·드래그하거나 ← → 키로 움직여요</p>`;
  if(m.type==='memory')$('#choices').innerHTML=`<p class="mg-help">🃏 카드를 두 장씩 뒤집어 짝을 맞춰요</p>`;
  setTimeout(()=>bang('준비…','mid'),150);
  setTimeout(()=>{if(done)return;bang('시작!','good');SFX.bang();t0=performance.now();
   if(m.type==='mash'){let taps=0;const fill=$('#mgFill');mashTap=()=>{if(done)return;taps++;fill.style.width=Math.min(100,taps/m.n*100)+'%';SFX.tick(taps);if(A[0])ACT.hop(A[0]);if(taps>=m.n)finish(true);};
    $('#choices .mash').addEventListener('pointerdown',e=>{e.preventDefault();mashTap&&mashTap();});tick(m.sec,()=>finish(false));}
   if(m.type==='timing'){const nd=$('#needle');let p=0;const loop=()=>{if(done)return;const el=(performance.now()-t0)/1000;p=Math.abs(((el*m.speed)%2)-1);nd.style.left=p*100+'%';if(el>12)return finish(false);raf=requestAnimationFrame(loop);};loop();
    mashTap=()=>finish(p>=m.zone[0]&&p<=m.zone[1]);$('#choices .mash').addEventListener('pointerdown',e=>{e.preventDefault();mashTap&&mashTap();});}
   if(m.type==='spot'){$$('#choices .spot').forEach(b=>b.onclick=()=>finish(+b.dataset.k===m.ans,+b.dataset.k));tick(m.sec,()=>finish(false,-1));}
   /* --- 받기 --- */
   if(m.type==='catch'){const P=$('#mgPlay'),W=()=>P.clientWidth,H=()=>P.clientHeight;let bx=.5,got=0,items=[],last=0,keys={};
    P.innerHTML=`<div class="mg-basket" id="mgBasket">${m.basket||'🧺'}</div>`;const bk=$('#mgBasket');score(`0 / ${m.goal}`);
    const mv=e=>{const r=P.getBoundingClientRect();bx=Math.max(.06,Math.min(.94,(e.clientX-r.left)/r.width));};
    P.addEventListener('pointermove',mv);P.addEventListener('pointerdown',mv);
    mgKey=e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){keys[e.key]=e.type==='keydown';e.preventDefault();e.stopPropagation();}};
    document.addEventListener('keydown',mgKey,true);document.addEventListener('keyup',mgKey,true);
    const loop=now=>{if(done)return;const el=timeBar(m.sec);if(el>=m.sec)return finish(got>=m.goal);
     if(keys.ArrowLeft)bx=Math.max(.06,bx-.018);if(keys.ArrowRight)bx=Math.min(.94,bx+.018);bk.style.left=bx*100+'%';
     if(now-last>Math.max(380,720-el*18)){last=now;const bad=Math.random()<.32;const e=document.createElement('i');e.className='mg-item';e.textContent=(bad?m.bad:m.good)[Math.random()*(bad?m.bad:m.good).length|0];
      const it={e,x:.06+Math.random()*.88,y:-.08,v:.0055+Math.random()*.004+el*.00018,bad};e.style.left=it.x*100+'%';P.appendChild(e);items.push(it);}
     items=items.filter(it=>{it.y+=it.v;it.e.style.top=it.y*100+'%';
      if(it.y>.78&&it.y<.92&&Math.abs(it.x-bx)<.09){it.e.remove();if(it.bad){got=Math.max(0,got-1);SFX.bad();P.classList.remove('hit');void P.offsetWidth;P.classList.add('hit');}else{got++;SFX.coin();bk.classList.remove('gulp');void bk.offsetWidth;bk.classList.add('gulp');}
       score(`${got} / ${m.goal}`);if(got>=m.goal){finish(true);}return false;}
      if(it.y>1.05){it.e.remove();return false;}return true;});
     raf=requestAnimationFrame(loop);};raf=requestAnimationFrame(loop);}
   /* --- 짝 맞추기 --- */
   if(m.type==='memory'){const P=$('#mgPlay');const cards=shuffle(m.pairs.flatMap((p,i)=>[[p[0],i],[p[1],i]]));let open=[],matched=0,lock=false;
    P.innerHTML=`<div class="mg-grid" style="--cols:${cards.length>8?4:4}">${cards.map(([t,i],k)=>`<button class="mg-cardf" data-i="${i}" data-k="${k}"><span class="b">?</span><span class="f">${t}</span></button>`).join('')}</div>`;
    score(`0 / ${m.pairs.length}`);
    $$('.mg-cardf').forEach(c=>c.onclick=()=>{if(lock||done||c.classList.contains('up'))return;c.classList.add('up');SFX.pop();open.push(c);
     if(open.length===2){const[a,b]=open;open=[];if(a.dataset.i===b.dataset.i){matched++;SFX.coin();setTimeout(()=>{a.classList.add('ok');b.classList.add('ok');},200);score(`${matched} / ${m.pairs.length}`);if(matched>=m.pairs.length)setTimeout(()=>finish(true),450);}
      else{lock=true;setTimeout(()=>{a.classList.remove('up');b.classList.remove('up');lock=false;},650);}}});
    tick(m.sec,()=>finish(false));}
   /* --- 분류 --- */
   if(m.type==='sort'){const P=$('#mgPlay');let deck=shuffle([...m.items]),ok=0,cur=null,pen=0;
    P.innerHTML=`<div class="mg-bins"><span class="l">◀ ${m.bins[0]}</span><span class="r">${m.bins[1]} ▶</span></div><div class="mg-sortcard" id="mgSc"></div>`;
    const show=()=>{if(!deck.length)deck=shuffle([...m.items]);cur=deck.pop();const c=$('#mgSc');c.textContent=cur[0];c.className='mg-sortcard in';};
    const answer=k=>{if(done||!cur)return;const c=$('#mgSc');if(k===cur[1]){ok++;SFX.coin();c.className='mg-sortcard go'+k;}else{pen+=1.5;SFX.bad();c.className='mg-sortcard no';}
     score(`${ok} / ${m.need}`);if(ok>=m.need)return finish(true);cur=null;setTimeout(show,230);};
    $$('#choices .spot').forEach(b=>b.onclick=()=>answer(+b.dataset.k));
    mgKey=e=>{if(e.key==='ArrowLeft'||e.key==='1'){answer(0);e.preventDefault();e.stopPropagation();}if(e.key==='ArrowRight'||e.key==='2'){answer(1);e.preventDefault();e.stopPropagation();}};
    document.addEventListener('keydown',mgKey,true);score(`0 / ${m.need}`);show();
    const loop=()=>{if(done)return;const el=(performance.now()-t0)/1000+pen,tb=$('#mgTime');if(tb)tb.style.width=Math.max(0,1-el/m.sec)*100+'%';if(el>=m.sec)return finish(false);raf=requestAnimationFrame(loop);};loop();}
   /* --- 리듬 --- */
   if(m.type==='rhythm'){const P=$('#mgPlay'),beat=60/(m.bpm||110)*1000,travel=1700;let hits=0,passed=0,notes=[];
    P.innerHTML=`<div class="mg-lane"><b class="mg-hit"></b></div>`;const lane=P.firstChild;score(`0 / ${m.need}`);
    const pattern=[];let tt=600;for(let i=0;i<m.n;i++){pattern.push(tt);tt+=beat*(Math.random()<.25?.5:Math.random()<.2?1.5:1);}
    pattern.forEach(at=>timers.push(setTimeout(()=>{if(done)return;const e=document.createElement('i');e.className='mg-note';e.textContent=m.icon||'🥁';lane.appendChild(e);notes.push({e,t:performance.now()+travel,hit:false});},at)));
    const judge=()=>{const now=performance.now();let best=null,bd=1e9;notes.forEach(n=>{const d=Math.abs(n.t-now);if(!n.hit&&d<bd){bd=d;best=n;}});
     if(best&&bd<170){best.hit=true;hits++;best.e.className='mg-note ok';SFX.coin();lane.classList.remove('flashok');void lane.offsetWidth;lane.classList.add('flashok');if(A[0])ACT.hop(A[0]);score(`${hits} / ${m.need}`);if(hits>=m.need)finish(true);}
     else{SFX.blip();lane.classList.remove('flashno');void lane.offsetWidth;lane.classList.add('flashno');}};
    mashTap=judge;$('#choices .mash').addEventListener('pointerdown',e=>{e.preventDefault();judge();});
    const total=pattern[pattern.length-1]+travel+500;
    const loop=()=>{if(done)return;const now=performance.now(),el=now-t0,tb=$('#mgTime');if(tb)tb.style.width=Math.max(0,1-el/total)*100+'%';
     notes=notes.filter(n=>{const p=(n.t-now)/travel;n.e.style.left=(12+p*84)+'%';if(p<-.15){if(!n.hit){passed++;n.e.className='mg-note miss';}setTimeout(()=>n.e.remove(),250);return false;}return true;});
     if(el>=total)return finish(hits>=m.need);raf=requestAnimationFrame(loop);};loop();}
   /* --- OX --- */
   if(m.type==='ox'){const P=$('#mgPlay');const qs=shuffle([...m.qs]);let qi=0,ok=0,qt=0;
    P.innerHTML=`<div class="mg-q" id="mgQ"></div>`;score(`0 / ${m.need}`);
    const ask=()=>{if(done)return;if(qi>=qs.length)return finish(ok>=m.need);const q=$('#mgQ');q.textContent=qs[qi][0];q.className='mg-q in';qt=performance.now();};
    const answer=k=>{if(done||!qt)return;const right=k>=0&&((k===0)===qs[qi][1]),q=$('#mgQ');qt=0;if(right){ok++;SFX.coin();q.className='mg-q good';}else{SFX.bad();q.className='mg-q bad';}
     q.textContent=(right?'⭕ 정답! ':'❌ 땡! ')+(qs[qi][2]||'');score(`${ok} / ${m.need}`);qi++;if(ok>=m.need)return setTimeout(()=>finish(true),700);timers.push(setTimeout(ask,qs[qi-1][2]?1300:700));};
    $$('#choices .spot').forEach(b=>b.onclick=()=>answer(+b.dataset.k));
    const loop=()=>{if(done)return;if(qt){const el=(performance.now()-qt)/1000,tb=$('#mgTime');if(tb)tb.style.width=Math.max(0,1-el/m.sec)*100+'%';if(el>=m.sec)answer(-1);}raf=requestAnimationFrame(loop);};
    ask();loop();}
  },1000);});}

function aprop(a,em,pos,anim,ms,flip){if(!a||!a.el||!a.rx)return null;const host=(flip&&a.rx.querySelector('.fl'))||a.rx;
 const e=document.createElement('i');e.className=`afx ${pos} an-${anim}`;e.textContent=em;const k=/^(tear|sweat|steam|keys|dust)/.test(pos)?.5:/^(front|cover)/.test(pos)?1.25:1;e.style.fontSize=Math.max(14,Math.min(110,a.el.offsetWidth*.36*k))+'px';host.appendChild(e);
 if(ms)setTimeout(()=>{e.classList.add('out');setTimeout(()=>e.remove(),320);},ms);return e;}
function adrops(a,em,pos,n,gap){for(let i=0;i<n;i++)setTimeout(()=>aprop(a,em,pos+(i%2?' r2':''),'drop',700),i*gap);}
